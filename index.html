<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocketship changelog</title>
<style>
  :root { --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --soft: #eef1f4;
          --bg: #fff; --add: #1a7f37; --del: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --soft: #262c33;
            --bg: #0d1117; --add: #3fb950; --del: #f85149; }
  }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 32px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .05em; color: var(--muted); padding: 0 12px 8px;
             border-bottom: 2px solid var(--line); }
  td, tbody th { padding: 9px 12px; vertical-align: top; border-top: 1px solid var(--soft); }
  tr.first > * { border-top: 1px solid var(--line); }
  .date { width: 230px; text-align: left; font-weight: 600; white-space: nowrap; }
  .diff, thead .diff { width: 120px; text-align: right; white-space: nowrap;
                       font-variant-numeric: tabular-nums; font-size: 13px; }
  .add { color: var(--add); }
  .del { color: var(--del); margin-left: 6px; }
  .none { color: var(--muted); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
         background: var(--soft); padding: 1px 4px; border-radius: 4px; }
  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; }
    tbody th.date { display: none; }
    tr { padding: 10px 0; border-top: 1px solid var(--soft); }
    td { border: 0 !important; padding: 0; }
    tr.first { border-top: 1px solid var(--line); margin-top: 8px; }
    tr.first td.msg::before { content: attr(data-date); display: block; font-weight: 600;
                              margin-bottom: 6px; }
    .diff { text-align: left; margin-top: 2px; }
  }
  .lock { max-width: 340px; }
  .lock input { font: inherit; color: var(--fg); background: var(--bg); width: 100%;
                box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line);
                border-radius: 6px; margin: 4px 0 10px; }
  .lock button { font: inherit; font-weight: 600; padding: 7px 16px; border: 0;
                 border-radius: 6px; background: var(--fg); color: var(--bg); cursor: pointer; }
  .lock .err { color: var(--del); min-height: 1.5em; margin: 8px 0 0; }
</style>
</head>
<body>
<main id="app">
<h1>Rocketship changelog</h1>
<form class="lock" id="lock">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">View changelog</button>
  <p class="err" id="err" role="alert"></p>
</form>
<noscript><p>This page needs JavaScript.</p></noscript>
</main>

const KEY = "rocketship-changelog-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(DATA.salt), iterations: DATA.iterations },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}

async function attempt(pw, quiet) {
  try {
    document.getElementById("app").innerHTML = await unlock(pw);
    try { localStorage.setItem(KEY, pw); } catch (e) {}
    return true;
  } catch (e) {
    if (!quiet) document.getElementById("err").textContent = "Wrong password.";
    return false;
  }
}

document.getElementById("lock").addEventListener("submit", e => {
  e.preventDefault();
  attempt(document.getElementById("pw").value, false);
});

(async () => {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("p") || decodeURIComponent(location.hash.slice(1));
  if (fromUrl) history.replaceState(null, "", location.pathname);  // keep it out of the address bar
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (fromUrl && await attempt(fromUrl, false)) return;
  if (saved && !(await attempt(saved, true))) {
    try { localStorage.removeItem(KEY); } catch (e) {}  // password changed since last visit
  }
})();
</script>
